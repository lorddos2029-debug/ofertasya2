<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagamento PIX | Ofertasya</title><script src="https://cdn.tailwindcss.com"></script><style>@keyframes appear{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}.confirmed{animation:appear .4s ease-out}@media(prefers-reduced-motion:reduce){.confirmed{animation:none}}</style></head><body class="bg-slate-100 text-slate-900"><main class="max-w-lg mx-auto p-5 py-10"><a href="/" class="text-orange-700">← Ofertasya</a><section class="bg-white rounded-2xl shadow-sm p-6 mt-5"><h1 class="font-bold text-2xl">Pagamento com PIX</h1><p class="text-slate-500 mt-2">Preencha seus dados para gerar o pagamento.</p><form id="form" class="grid gap-4 mt-6">
<label>Produto<select id="product" class="block w-full border rounded-lg p-3 mt-1" required></select></label><p id="price" class="font-bold text-emerald-700"></p><label>Nome completo<input id="name" autocomplete="name" required minlength="5" maxlength="120" class="block w-full border rounded-lg p-3 mt-1"></label><label>E-mail<input id="email" type="email" autocomplete="email" required maxlength="254" class="block w-full border rounded-lg p-3 mt-1"></label><label>CPF<input id="cpf" inputmode="numeric" required maxlength="14" class="block w-full border rounded-lg p-3 mt-1"></label><label>Telefone com DDD<input id="phone" required type="tel" autocomplete="tel" maxlength="20" class="block w-full border rounded-lg p-3 mt-1"></label><h2 class="font-semibold">Endereço de entrega</h2><label>CEP<input name="cep" inputmode="numeric" autocomplete="postal-code" pattern="[0-9]{8}" placeholder="8 números" required class="block w-full border rounded-lg p-3 mt-1"></label><label>Rua<input name="logradouro" autocomplete="address-line1" required maxlength="150" class="block w-full border rounded-lg p-3 mt-1"></label><div class="grid grid-cols-2 gap-3"><label>Número<input name="numero" required maxlength="150" class="block w-full border rounded-lg p-3 mt-1"></label><label>Bairro<input name="bairro" required maxlength="150" class="block w-full border rounded-lg p-3 mt-1"></label></div><div class="grid grid-cols-2 gap-3"><label>Cidade<input name="cidade" autocomplete="address-level2" required maxlength="150" class="block w-full border rounded-lg p-3 mt-1"></label><label>UF<input name="uf" autocomplete="address-level1" required pattern="[A-Z]{2}" maxlength="2" placeholder="SP" class="block w-full border rounded-lg p-3 mt-1"></label></div><p class="text-sm text-slate-500">Frete grátis. O total é validado pela loja.</p><button id="generate" class="bg-orange-600 text-white font-bold rounded-lg p-3 disabled:opacity-50">Gerar PIX</button></form><p id="error" role="alert" class="text-red-700 mt-4" hidden></p><section id="pix" hidden class="mt-6 text-center"><h2 class="font-bold text-xl">Seu PIX está pronto</h2><img id="qr" class="w-64 max-w-full mx-auto my-5" alt="QR Code para pagamento PIX"><label class="block text-left">Código PIX<textarea id="code" readonly class="border rounded-lg p-3 w-full mt-2 text-xs" rows="4"></textarea></label><button id="copy" class="bg-orange-600 text-white rounded-lg p-3 w-full mt-3">Copiar código PIX</button><p id="status" role="status" aria-live="polite" class="text-sm text-slate-600 mt-4"></p><button id="check" class="underline mt-3">Verificar pagamento</button></section><section id="success" hidden class="confirmed text-center py-10"><div class="text-5xl text-emerald-600">✓</div><h2 class="font-bold text-2xl mt-4">Pagamento confirmado!</h2><p class="mt-2">Recebemos seu pagamento. Obrigado pela compra.</p><a class="block mt-5 underline" href="/">Voltar à loja</a></section></section></main><script>
// A credencial UrusPay é configurada exclusivamente no servidor /api/charge.
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');fbq('init','1849843465686098');fbq('track','PageView');
const API='/api/charge',PRODUCTS=[{"label":"Ventilador Torre Ventisol 3,6L · Branco · 110V","price":85.41,"item":{"productId":"ventilador","color":"Branco","quantity":1,"voltage":"110V"}},{"label":"Ventilador Torre Ventisol 3,6L · Branco · 220V","price":85.41,"item":{"productId":"ventilador","color":"Branco","quantity":1,"voltage":"220V"}},{"label":"Climatizador Ventisol CLIN16 Pro · Cinza · 110V","price":121.51,"item":{"productId":"climatizador","color":"Cinza","quantity":1,"voltage":"110V"}},{"label":"Climatizador Ventisol CLIN16 Pro · Cinza · 220V","price":121.51,"item":{"productId":"climatizador","color":"Cinza","quantity":1,"voltage":"220V"}},{"label":"Robô Aspirador IDALI LIFE · Preto","price":85.41,"item":{"productId":"robo","color":"Preto","quantity":1}},{"label":"Travesseiro Cervical ABRANUV · Cinza","price":66.41,"item":{"productId":"travesseiro","color":"Cinza","quantity":1}},{"label":"Panela Electrolux Rita Lobo PCE20 5L · Preto · 110V","price":75.91,"item":{"productId":"panela","color":"Preto","quantity":1,"voltage":"110V"}},{"label":"Panela Electrolux Rita Lobo PCE20 5L · Preto · 220V","price":75.91,"item":{"productId":"panela","color":"Preto","quantity":1,"voltage":"220V"}},{"label":"Purificador Electrolux PE11B Bivolt · Branco · Bivolt","price":75.91,"item":{"productId":"purificador","color":"Branco","voltage":"Bivolt","quantity":1}}];
const $=s=>document.querySelector(s),money=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
for(const [i,p] of PRODUCTS.entries()){const o=document.createElement('option');o.value=i;o.textContent=p.label;$('#product').append(o)}
$('#product').onchange=()=>$('#price').textContent=money(PRODUCTS[$('#product').value].price)+' no PIX';$('#product').onchange();
function validCPF(v){const s=v.replace(/\D/g,'');if(!/^\d{11}$/.test(s)||/^(\d)\1+$/.test(s))return false;for(let n=9;n<=10;n++){let sum=0;for(let i=0;i<n;i++)sum+=Number(s[i])*(n+1-i);if(Number(s[n])!==(sum*10%11)%10)return false}return true}
$('#cpf').oninput=e=>{const s=e.target.value.replace(/\D/g,'').slice(0,11);e.target.value=s.replace(/^(\d{3})(\d)/,'$1.$2').replace(/(\.\d{3})(\d)/,'$1.$2').replace(/(\.\d{3})(\d)/,'$1-$2')};
function cookie(k){try{return decodeURIComponent(document.cookie.split('; ').find(s=>s.startsWith(k+'='))?.slice(k.length+1)||'')}catch{return ''}}
function tracking(){const q=new URLSearchParams(location.search),d={};for(const k of ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','src','sck'])d[k]=q.get(k)||sessionStorage.getItem('ofertasya-'+k)||'';d.fbp=cookie('_fbp');const click=q.get('fbclid')||sessionStorage.getItem('ofertasya-fbclid');d.fbc=cookie('_fbc')||sessionStorage.getItem('ofertasya-fbc')||(click?'fb.1.'+Date.now()+'.'+click:'');if(d.fbc)sessionStorage.setItem('ofertasya-fbc',d.fbc);d.user_agent=navigator.userAgent;return d}
let charge=null,timer,busy=false,done=false,eventId=sessionStorage.getItem('ofertasya-standalone-event')||'ev_'+Date.now()+'_'+crypto.randomUUID();sessionStorage.setItem('ofertasya-standalone-event',eventId);
async function request(url,body){const r=await fetch(url,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(25000)});const d=await r.json();if(!r.ok||d.ok!==true)throw Error(d.error||'Não foi possível consultar o PIX. Tente novamente.');return d}
function paid(){done=true;clearTimeout(timer);$('#pix').hidden=true;$('#form').hidden=true;$('#success').hidden=false;const key='ofertasya-purchase-'+charge.venda_id;if(!localStorage.getItem(key)&&typeof window.fbq==='function'){window.fbq('track','InitiateCheckout',{value:charge.valor,currency:'BRL'},{eventID:charge.evento_id+'_ic'});window.fbq('track','Purchase',{value:charge.valor,currency:'BRL'},{eventID:charge.evento_id});localStorage.setItem(key,'true')}sessionStorage.removeItem('ofertasya-standalone-event');sessionStorage.removeItem('ofertasya-standalone-charge')}
async function check(){if(!charge||busy||done)return;busy=true;clearTimeout(timer);try{const d=await request(charge.check_status_url);if(d.pago===true||d.status==='paid'){paid();return}if(['cancelled','refunded'].includes(d.status)){done=true;$('#status').textContent=d.status==='cancelled'?'Este PIX foi cancelado.':'Pagamento estornado. Entre em contato com a loja.';return}$('#status').textContent='Aguardando pagamento. A confirmação é automática.'}catch{$('#status').textContent='Consulta indisponível. Tentaremos novamente.'}finally{busy=false;if(!done)timer=setTimeout(check,5000)}}
function show(d){if(!/^\/api\/status\/[A-Za-z0-9_-]{40,12000}$/.test(d.check_status_url))throw Error('Dados do pagamento inválidos.');charge=d;sessionStorage.setItem('ofertasya-standalone-charge',JSON.stringify(d));$('#form').hidden=true;$('#pix').hidden=false;$('#code').value=d.pix_code;$('#qr').src=d.qr_code_url?.startsWith('https://')?d.qr_code_url:d.check_status_url.replace('/api/status/','/api/qr/');$('#qr').onerror=()=>{$('#qr').hidden=true};check()}
$('#form').onsubmit=async e=>{e.preventDefault();$('#error').hidden=true;if(!$('#form').reportValidity())return;if(!/^(?:55)?[1-9]\d(?:[2-5]\d{7}|9\d{8})$/.test($('#phone').value.replace(/\D/g,''))||!validCPF($('#cpf').value)||!$('#name').value.trim().includes(' ')){$('#error').textContent='Confira o nome completo, CPF e telefone com DDD.';$('#error').hidden=false;return}$('#generate').disabled=true;try{const p=PRODUCTS[$('#product').value];show(await request(API,{nome:$('#name').value.trim(),email:$('#email').value.trim(),cpf:$('#cpf').value.replace(/\D/g,''),telefone:$('#phone').value.replace(/\D/g,''),valor:p.price,descricao:p.label,itens:[p.item],frete:'free',endereco:Object.fromEntries(new FormData($('#form'))),evento_id:eventId,...tracking()}))}catch(err){$('#error').textContent=err.name==='TimeoutError'?'O serviço demorou para responder. Tente novamente em instantes.':err.message;$('#error').hidden=false}finally{$('#generate').disabled=false}};
$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(charge.pix_code);$('#copy').textContent='Código copiado!'}catch{$('#code').focus();$('#code').select();$('#status').textContent='Selecione e copie o código PIX.'}};$('#check').onclick=check;
try{const saved=JSON.parse(sessionStorage.getItem('ofertasya-standalone-charge'));if(saved)show(saved)}catch{sessionStorage.removeItem('ofertasya-standalone-charge')}
</script></body></html>
